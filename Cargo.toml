[workspace]
resolver = "3"
members = [
    "packages/cli-common",
]

[workspace.package]
authors = ["Proof Commons"]
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.88"
version = "0.0.0-dev"

[workspace.dependencies]
cli-common = { path = "packages/cli-common" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0", features = ["process", "signal", "fs"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
textwrap = "0"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[workspace.lints.rust]
deprecated-safe = { level = "deny", priority = -1 }
future-incompatible = { level = "deny", priority = -1 }
let-underscore = { level = "deny", priority = -1 }
nonstandard-style = { level = "deny", priority = -1 }
rust-2018-compatibility = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
rust-2021-compatibility = { level = "deny", priority = -1 }
rust-2024-compatibility = { level = "deny", priority = -1 }
# ADR-011: unsafe is denied workspace-wide; a future crate with a
# genuine need scopes an explicit allow to the smallest module.
unsafe-code = "deny"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
exit = { level = "deny", priority = 0 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
print_stderr = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
