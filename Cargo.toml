[workspace]
resolver = "3"
members = [
    "packages/architecture",
    "packages/artifacts",
    "packages/cli-common",
    "packages/compiler",
    "packages/document-stamps",
    "packages/execwrap",
    "packages/flatten-latex-main",
    "packages/labels",
    "packages/linker",
    "packages/model",
    "packages/realization",
    "packages/tapscript",
    "packages/target-elements",
    "packages/target-elements-conformance",
    "packages/transaction",
    "packages/vectors",
]

[workspace.package]
authors = ["Proof Commons"]
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.88"
version = "0.6.0-dev"

[workspace.dependencies]
architecture = { package = "tripod-architecture", path = "packages/architecture" }
artifacts = { package = "tripod-artifacts", path = "packages/artifacts" }
cli-common = { path = "packages/cli-common" }
compiler = { package = "tripod-compiler", path = "packages/compiler" }
execwrap = { path = "packages/execwrap" }
flatten-latex-main = { path = "packages/flatten-latex-main" }
labels = { package = "tripod-labels", path = "packages/labels" }
linker = { package = "tripod-linker", path = "packages/linker" }
model = { package = "tripod-model", path = "packages/model" }
realization = { package = "tripod-realization", path = "packages/realization" }
tapscript = { package = "tripod-tapscript", path = "packages/tapscript" }
target-elements = { package = "tripod-target-elements", path = "packages/target-elements" }
target-elements-conformance = { package = "tripod-target-elements-conformance", path = "packages/target-elements-conformance" }
transaction = { package = "tripod-transaction", path = "packages/transaction" }
vectors = { package = "tripod-vectors", path = "packages/vectors" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Reference-implementation oracles for testing: agreement with them is
# conformance-to-target evidence, because they bind the same C library
# the node vendors (the Wave-5 / Guide-11 independence analysis stands
# — the first-party oracles keep the independence claim, and these
# crates never replace them). The raw `secp256k1-zkp-sys` FFI crate is
# never a direct dependency: the wrapper already carries it as its own
# vendored backend, so a direct edge would add a second, unwrapped
# C-API surface for nothing — verified provenance: both crates declare
# ElementsProject/rust-secp256k1-zkp as their repository, and
# `elements` declares ElementsProject/rust-elements.
# `elements` pinned to the version the Wave-5 review of record examined
# (packages/target-elements/src/transaction_form.rs); the default
# `json-contract` feature is not needed by an oracle role.
elements = { version = "=0.27.0", default-features = false }
secp256k1-zkp = "0.11"
nix = { version = "0", features = ["process", "signal", "fs", "term"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
# Only `serde-1` is enabled, retained deliberately for anticipated raw
# label-graph serialization (noncanonical diagnostics; see the guard test
# in packages/labels). The former `dot_parser`, `rayon`, `unstable`, and
# `generate` features were dropped (P2-002 review): none had a first-party
# consumer, and per the backlog dependency-entry rule and the adopted
# identity discipline's benefit criterion, a feature is not carried to
# advertise intent. `dot_parser` additionally pulled GPL-2.0-or-later
# crates into the first-party build graph, which ADR-011's dependency rule
# does not admit without a separate policy decision, and `rayon` added
# nondeterministic parallelism. Consumers use only core petgraph
# (DiGraph / NodeIndex / Direction / visit).
petgraph = { version = "=0.8.3", features = ["serde-1"] }
proptest = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
textwrap = "0"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_compatibility = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
# ADR-011: unsafe is denied workspace-wide; a future crate with a
# genuine need scopes an explicit allow to the smallest module.
unsafe_code = "deny"
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
exit = { level = "deny", priority = 0 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
print_stderr = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
