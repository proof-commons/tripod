[package]
name = "tripod-target-elements-conformance"
description = "Secretless target-native conformance harness for reviewed Elements primitives"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "target_elements_conformance"

# Exactly the three first-party packages the harness joins. The target
# package owns the reviewed semantics the fixtures are stated against,
# the tapscript package owns the typed program whose exact bytes a
# fixture carries, and `cli-common` owns the ADR-010 command contract the
# checker binary follows. `compiler`, `architecture`, `realization`,
# `model`, `linker`, `transaction`, `vectors`, `release`, `artifacts`,
# and `labels` are absent: this package owns execution protocol and
# evidence mechanics, and naming any of those would either restate
# target semantics it does not own or import a publication boundary it
# has no asset for.
#
# The hashing and bignum entries are for the constructor oracle and for
# nothing else. No report, fixture, executor, instruction, or target
# digest is minted here and none may be (Guide-9 §1.8): what these
# compute are *target* values — a tagged leaf hash, a branch hash, a
# tweak, a tweaked output key — which the target itself computes the
# same way, and which a fixture states rather than a report identifies.
#
# Both are existing workspace dependencies with existing first-party
# consumers, so the oracle adds no third-party crate to the workspace
# and no entry to the lock file. A dedicated curve library was
# considered and not taken (Guide-10 §26.2): the oracle's value is being
# independent of the implementation it checks, the operations needed are
# public-point arithmetic over published constants, and no secret scalar
# exists here for a constant-time implementation to protect.
#
# The confidential-value oracle (Guide-11 §6, §7) reaches the same
# answer for the same reasons, and one further reason that is decisive
# rather than merely sufficient. The target materializes confidential
# transactions with the zero-knowledge secp256k1 fork the node vendors
# in-tree. The Rust bindings to that library — `secp256k1` and
# `secp256k1-zkp` — are FFI wrappers around that same C code, so
# adopting either would make the oracle and the thing it checks one
# opinion wearing two hats, and any agreement they reported would be a
# tautology rather than evidence (Guide-11 §6.3). A pure-Rust curve
# crate would avoid that specific collapse, but it would also add a
# cryptographic dependency, its transitive graph, and its advisory
# surface to a workspace that needs none of it: what the oracle computes
# is a curve map, two point additions, and two scalar multiplications
# over published constants, all of it public and none of it
# performance-bound.
#
# So the confidential oracle is first-party arithmetic over the same
# bignum, and the independence claim is unqualified: no library is
# shared with the materializer, so §6.3's fallback of recording a shared
# dependency and narrowing the claim does not arise. Nothing entered
# `target-elements`, which stays standard-library-only (§6.1).
[dependencies]
cli-common = { workspace = true }
tapscript = { workspace = true }
target-elements = { workspace = true }

clap = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
# `nix` carries the POSIX process-group calls the executor supervisor
# needs — a graceful group signal, a bounded non-reaping wait, and a
# forceful group signal — so that a timed-out run terminates the whole
# executor tree rather than only its first process (Guide-10 §5.8). It
# is already a workspace dependency and remains the only route to those
# calls that does not open an unsafe block, which ADR-011 denies.
nix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
