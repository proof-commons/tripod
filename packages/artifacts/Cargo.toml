[package]
name = "tripod-artifacts"
description = "Single generator/checker for the workspace's generated derivative artifacts"

# Package metadata is inherited from the Blueprint workspace.
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

# Imported as `artifacts`; the package name above is the published
# identity (`-p tripod-artifacts`).
[lib]
name = "artifacts"

[dependencies]
anyhow = { workspace = true }
architecture = { workspace = true }
clap = { workspace = true }
cli-common = { workspace = true }
model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
