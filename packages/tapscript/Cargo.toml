[package]
name = "tripod-tapscript"
description = "Adapter from compiler-owned abstract target requirements to Elements target obligations"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "tapscript"

# Assessment consumes compiler-carried identifiers. The STATE constructor
# instead commits canonical bytes that only realization's codec produces;
# sha2 hashes those bytes with the target's domain-separated tags.
# Curve arithmetic remains a downstream capability, not a dependency.
# thiserror derives the constructor's closed refusal vocabulary.
[dependencies]
compiler = { workspace = true }
realization = { workspace = true }
sha2 = { workspace = true }
target-elements = { workspace = true }
thiserror = { workspace = true }

# Architecture is needed only to construct compiler-owned test fixtures.
[dev-dependencies]
architecture = { workspace = true }

[lints]
workspace = true
