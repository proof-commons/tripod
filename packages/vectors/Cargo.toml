[package]
name = "tripod-vectors"
description = "Canonical compact-ASH semantic and target fixtures, and the evidence plan that indexes them by relation-case"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "vectors"

# Guide-12 §16.1 names `architecture`, `realization`, `model`, `compiler`,
# `target-elements`, `linker`, and `transaction` as this package's expected
# direct dependencies, and the package contract forbids `release`. Wave 10
# takes only the subset it actually calls, because an unused dependency
# would advertise a reach this wave has not earned:
#
# - `realization` owns the relation identities the coverage matrix is
#   indexed by, so a relation-case cannot be named without it;
# - `compiler` owns the coverage requirements the plan derives from;
# - `transaction` owns the ABI, the typed request, the public construction
#   view, and the exact target transaction bytes materialization produces;
# - `linker` owns the linked bundle those all bind to;
# - `architecture` is needed to build the fixture bundle at all.
#
# `model` is deliberately absent this wave. No fixture yet executes the
# model path: §17.1's approved test-only synthetic-ASH fixture is not
# minted here, and adding the edge before there is a call would advertise
# a reach this wave has not earned. It enters when Wave 11 or a later
# wave gives it something to do.
#
# `tapscript` is listed even though the package contract says no direct
# tapscript dependency is *required* "when final programs and provenance
# are exposed through `linker`". That condition holds for reading a
# bundle and fails for building one: `LinkDeploymentParameters::new`
# takes a `CompactAshSymbols`, and the backend entry point that produces
# a relocatable bundle at all is `tapscript::emit_candidate_bundle`.
# Neither is reachable through `linker`. The transaction and linker
# crates take the same edge as a dev-dependency because their fixture
# bundle is test input; here the bundle is the substrate a later wave
# executes against a real node, and a substrate reachable only from a
# cfg-gated module cannot be executed by anything.
#
# `target-elements-conformance` is absent, and the §16.2 decision Wave 10
# left open is now settled: the boundary was WIDENED rather than
# extracted. That package's executor gained a target-generic operation
# workload — a caller-supplied plan of funding and submission steps, over
# bytes, programs, outpoints, and the existing observed-layer vocabulary —
# so no shared executor package was needed and the preferred first-
# operation direction §16.2 states holds as written.
#
# §16.2 permits this package to take that narrow boundary as a
# dependency. Wave 10's own rule decides not to take it yet: nothing here
# calls it, because calling it needs a live node, and an unused
# dependency advertises a reach this wave has not earned. The edge is
# also not free — `target-elements-conformance` dev-depends on this
# package for the reference cross-checks, so the edge closes a cycle
# through that lane — which is a reason to take it deliberately in Wave
# 11 rather than speculatively here.
#
# What this package names instead is its own obligation:
# `RequiredTargetWork` states the ceremony steps and the vector
# submissions the plan is waiting for, in `FundingCeremonyStep`'s
# vocabulary from `transaction` and this package's own vector
# identities. No executor record, no wire spelling, and no second
# authored source for either name (§1.12). Wave 11 adds the edge and
# writes the one mapping from these onto the executor's step records.
[dependencies]
architecture = { workspace = true }
compiler = { workspace = true }
linker = { workspace = true }
realization = { workspace = true }
tapscript = { workspace = true }
target-elements = { workspace = true }
transaction = { workspace = true }

[lints]
workspace = true
