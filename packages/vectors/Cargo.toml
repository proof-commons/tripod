[package]
name = "tripod-vectors"
description = "Canonical compact-ASH semantic and target fixtures, and the evidence plan that indexes them by relation-case"

authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "vectors"

# Guide-12 §16.1 names `architecture`, `realization`, `model`, `compiler`,
# `target-elements`, `linker`, and `transaction` as this package's expected
# direct dependencies, and the package contract forbids `release`. Wave 10
# takes only the subset it actually calls, because an unused dependency
# would advertise a reach this wave has not earned:
#
# - `realization` owns the relation identities the coverage matrix is
#   indexed by, so a relation-case cannot be named without it;
# - `compiler` owns the coverage requirements the plan derives from;
# - `transaction` owns the ABI, the typed request, the public construction
#   view, and the exact target transaction bytes materialization produces;
# - `linker` owns the linked bundle those all bind to;
# - `architecture` is needed to build the fixture bundle at all.
#
# `model` and `target-elements` are deliberately absent from the runtime
# dependency set this wave: no fixture yet executes the model path (the
# approved test-only synthetic-ASH fixture of §17.1 is not minted here),
# and no fixture yet executes a target. Both enter when Wave 11 gives them
# something to do, which keeps the dependency edge honest about what has
# actually been built rather than what is planned.
#
# `target-elements-conformance` is absent for the reason §16.2 gives: it
# owns target-generic process supervision, and this package must not be
# able to obtain an expectation from the same component that will later
# produce the observation it is judged against.
[dependencies]
architecture = { workspace = true }
compiler = { workspace = true }
linker = { workspace = true }
realization = { workspace = true }
transaction = { workspace = true }

# Test-only. Exact bytes need a real linked bundle, and the only way to
# obtain one is to run the compiler, the backend, and the linker over a
# real architecture body, exactly as the transaction crate's own tests do.
[dev-dependencies]
tapscript = { workspace = true }

[lints]
workspace = true
